<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Capa de Le Livre des Médiums">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b4a"/>
      <stop offset=".6" stop-color="#4f5d8c"/>
      <stop offset="1" stop-color="#252b4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".32" r=".6">
      <stop offset="0" stop-color="#d9c79a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d9c79a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#f8f3e8" stroke-opacity=".2"/>
  <text x="300" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="7" fill="#f8f3e8" fill-opacity=".82">LUMEN</text>
  <text x="300" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="2.2" fill="#f8f3e8" fill-opacity=".52">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
    <g stroke="#d9c79a" stroke-width="1" opacity=".55">
      <path d="M148 392l52-77 74 28 46-92 78 61 66-40"/>
      <path d="M200 315l24 89 50-62 74 105 42-129"/>
    </g>
    <g fill="#d9c79a">
      <circle cx="148" cy="392" r="3"/><circle cx="200" cy="315" r="5"/>
      <circle cx="320" cy="251" r="4"/><circle cx="398" cy="312" r="3"/>
      <circle cx="348" cy="509" r="3"/><circle cx="390" cy="380" r="2.4"/>
    </g>
  <text x="300" y="449" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Le Livre des</text><text x="300" y="505" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Médiums</text>
  <line x1="238" y1="555" x2="362" y2="555" stroke="#d9c79a" stroke-opacity=".75"/>
  <text x="300" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="2.5" fill="#f8f3e8" fill-opacity=".85">ALLAN KARDEC</text>
  <text x="300" y="814" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#f8f3e8" fill-opacity=".72">Guide des médiums et des évocateurs</text>
  <text x="300" y="847" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="1.8" fill="#f8f3e8" fill-opacity=".48">ÉDITION INTÉGRALE · DOMAINE PUBLIC · 1861</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
</svg>