  <text x="300" y="814" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#f8f3e8" fill-opacity=".72">Conditions et moyens de communiquer avec les Esprits</text>
  <text x="300" y="847" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="1.8" fill="#f8f3e8" fill-opacity=".48">ÉDITION INTÉGRALE · DOMAINE PUBLIC · 1858</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
