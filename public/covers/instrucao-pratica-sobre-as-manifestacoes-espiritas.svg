  <text x="300" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="2.2" fill="#f8f3e8" fill-opacity=".52">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
    <g stroke="#e4ca91" stroke-width="1.1" opacity=".52">
      <line x1="300.0" y1="240.0" x2="300.0" y2="110.0"/><line x1="314.6" y1="241.5" x2="341.6" y2="114.4"/><line x1="328.5" y1="246.1" x2="381.3" y2="127.3"/><line x1="341.1" y1="253.4" x2="417.6" y2="148.2"/><line x1="352.0" y1="263.2" x2="448.6" y2="176.2"/><line x1="360.6" y1="275.0" x2="473.2" y2="210.0"/><line x1="366.6" y1="288.4" x2="490.2" y2="248.2"/><line x1="369.6" y1="302.7" x2="498.9" y2="289.1"/><line x1="369.6" y1="317.3" x2="498.9" y2="330.9"/><line x1="366.6" y1="331.6" x2="490.2" y2="371.8"/><line x1="360.6" y1="345.0" x2="473.2" y2="410.0"/><line x1="352.0" y1="356.8" x2="448.6" y2="443.8"/><line x1="341.1" y1="366.6" x2="417.6" y2="471.8"/><line x1="328.5" y1="373.9" x2="381.3" y2="492.7"/><line x1="314.6" y1="378.5" x2="341.6" y2="505.6"/>
    </g>
    <circle cx="300" cy="310" r="45" fill="#e4ca91" opacity=".2"/>
  <text x="300" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Instruction</text><text x="300" y="451" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">pratique sur les</text><text x="300" y="507" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">manifestations</text><text x="300" y="563" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">spirites</text>
  <line x1="238" y1="613" x2="362" y2="613" stroke="#e4ca91" stroke-opacity=".75"/>
