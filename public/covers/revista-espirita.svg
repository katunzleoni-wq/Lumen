<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Capa de Revista Espírita — Antologia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283d30"/>
      <stop offset=".58" stop-color="#58725d"/>
      <stop offset="1" stop-color="#283d30"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".34" r=".58">
      <stop offset="0" stop-color="#d8c08a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d8c08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
