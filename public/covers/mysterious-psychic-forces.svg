  <text x="300" y="847" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="1.8" fill="#f8f3e8" fill-opacity=".48">COMPLETE EDITION · PUBLIC DOMAIN · 1907</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
