  <text x="300" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="2.2" fill="#f8f3e8" fill-opacity=".52">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
    <g stroke="#d8c08a" stroke-width=".7" opacity=".32">
      <line x1="90" y1="175" x2="510" y2="175"/><line x1="90" y1="199" x2="510" y2="199"/><line x1="90" y1="223" x2="510" y2="223"/><line x1="90" y1="247" x2="510" y2="247"/><line x1="90" y1="271" x2="510" y2="271"/><line x1="90" y1="295" x2="510" y2="295"/><line x1="90" y1="319" x2="510" y2="319"/><line x1="90" y1="343" x2="510" y2="343"/><line x1="90" y1="367" x2="510" y2="367"/><line x1="90" y1="391" x2="510" y2="391"/><line x1="90" y1="415" x2="510" y2="415"/><line x1="90" y1="439" x2="510" y2="439"/><line x1="90" y1="463" x2="510" y2="463"/>
      <line x1="120" y1="150" x2="120" y2="500"/><line x1="160" y1="150" x2="160" y2="500"/><line x1="200" y1="150" x2="200" y2="500"/><line x1="240" y1="150" x2="240" y2="500"/><line x1="280" y1="150" x2="280" y2="500"/><line x1="320" y1="150" x2="320" y2="500"/><line x1="360" y1="150" x2="360" y2="500"/><line x1="400" y1="150" x2="400" y2="500"/><line x1="440" y1="150" x2="440" y2="500"/><line x1="480" y1="150" x2="480" y2="500"/>
    </g>
    <rect x="248" y="268" width="104" height="104" fill="#d8c08a" opacity=".14"/>
  <text x="300" y="449" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Mysterious Psychic</text><text x="300" y="505" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Forces</text>
  <line x1="238" y1="555" x2="362" y2="555" stroke="#d8c08a" stroke-opacity=".75"/>
