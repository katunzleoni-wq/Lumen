  <text x="300" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="2.2" fill="#f8f3e8" fill-opacity=".52">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
    <g fill="none" stroke="#e0bd83" stroke-width="1.4" opacity=".65">
      <path d="M120 520V320a180 180 0 0 1 360 0v200"/>
      <path d="M160 520V328a140 140 0 0 1 280 0v192" opacity=".7"/>
      <path d="M200 520V336a100 100 0 0 1 200 0v184" opacity=".42"/>
    </g>
  <text x="300" y="449" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">L'Évangile selon le</text><text x="300" y="505" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Spiritisme</text>
  <line x1="238" y1="555" x2="362" y2="555" stroke="#e0bd83" stroke-opacity=".75"/>
  <text x="300" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="2.5" fill="#f8f3e8" fill-opacity=".85">ALLAN KARDEC</text>
  <text x="300" y="814" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#f8f3e8" fill-opacity=".72">La morale de Jésus à la lumière de la raison</text>
  <text x="300" y="847" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="1.8" fill="#f8f3e8" fill-opacity=".48">ÉDITION INTÉGRALE · DOMAINE PUBLIC · 1864</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
