<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Capa de Le Livre des Esprits">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153f36"/>
      <stop offset=".6" stop-color="#2f6b57"/>
      <stop offset="1" stop-color="#153f36"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".32" r=".6">
      <stop offset="0" stop-color="#d4ad68" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d4ad68" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#f8f3e8" stroke-opacity=".2"/>
  <text x="300" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="7" fill="#f8f3e8" fill-opacity=".82">LUMEN</text>
  <text x="300" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="2.2" fill="#f8f3e8" fill-opacity=".52">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
    <g fill="none" stroke="#d4ad68" stroke-width="1.1" opacity=".7">
      <ellipse cx="300" cy="292" rx="210" ry="92" transform="rotate(-24 300 292)"/>
      <circle cx="300" cy="292" r="150" opacity=".5"/>
      <circle cx="432" cy="198" r="5" fill="#d4ad68" stroke="none"/>
    </g>
    <circle cx="300" cy="292" r="48" fill="#d4ad68" opacity=".18"/>
  <text x="300" y="449" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Le Livre des</text><text x="300" y="505" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-.5" fill="#f8f3e8">Esprits</text>
  <line x1="238" y1="555" x2="362" y2="555" stroke="#d4ad68" stroke-opacity=".75"/>
  <text x="300" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="2.5" fill="#f8f3e8" fill-opacity=".85">ALLAN KARDEC</text>
  <text x="300" y="814" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#f8f3e8" fill-opacity=".72">Principes de la doctrine spirite</text>
  <text x="300" y="847" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.4" letter-spacing="1.8" fill="#f8f3e8" fill-opacity=".48">ÉDITION INTÉGRALE · DOMAINE PUBLIC · 1857</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
</svg>