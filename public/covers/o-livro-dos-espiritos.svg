<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Capa de O Livro dos Espíritos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153f36"/>
      <stop offset=".58" stop-color="#2f6b57"/>
      <stop offset="1" stop-color="#153f36"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".34" r=".58">
      <stop offset="0" stop-color="#d4ad68" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d4ad68" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#f8f3e8" stroke-opacity=".22"/>
  <text x="300" y="83" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="7" fill="#f8f3e8" fill-opacity=".82">LUMEN</text>
  <text x="300" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.6" letter-spacing="2.4" fill="#f8f3e8" fill-opacity=".56">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
        <g fill="none" stroke="#d4ad68" stroke-width="1.1" opacity=".8">
          <ellipse cx="300" cy="290" rx="210" ry="92" transform="rotate(-24 300 290)"/>
          <ellipse cx="300" cy="290" rx="168" ry="168" opacity=".5"/>
          <circle cx="434" cy="196" r="5" fill="#d4ad68" stroke="none"/>
          <circle cx="167" cy="363" r="3.5" fill="#d4ad68" stroke="none"/>
        </g>
        <circle cx="300" cy="290" r="62" fill="#d4ad68" opacity=".12"/>
        <circle cx="300" cy="290" r="31" fill="#d4ad68" opacity=".24"/>
  <text x="300" y="442" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="-.6" fill="#f8f3e8">O Livro dos</text><text x="300" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="-.6" fill="#f8f3e8">Espíritos</text>
  <line x1="238" y1="554" x2="362" y2="554" stroke="#d4ad68" stroke-opacity=".75"/>
  <text x="300" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.6" fill="#f8f3e8" fill-opacity=".84">ALLAN KARDEC</text>
  <text x="300" y="812" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#f8f3e8" fill-opacity=".68">Princípios da doutrina espírita</text>
  <text x="300" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="2" fill="#f8f3e8" fill-opacity=".46">AMOSTRA EDITORIAL · 1857</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
</svg>