<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="Capa de O Céu e o Inferno">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2440"/>
      <stop offset=".58" stop-color="#6c4c6f"/>
      <stop offset="1" stop-color="#3b2440"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".34" r=".58">
      <stop offset="0" stop-color="#d7b77a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d7b77a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#f8f3e8" stroke-opacity=".22"/>
  <text x="300" y="83" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="7" fill="#f8f3e8" fill-opacity=".82">LUMEN</text>
  <text x="300" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.6" letter-spacing="2.4" fill="#f8f3e8" fill-opacity=".56">BIBLIOTECA DIGITAL ESPÍRITA INTERNACIONAL</text>
  
        <circle cx="300" cy="292" r="106" fill="#d7b77a" opacity=".14"/>
        <path d="M346 201a104 104 0 1 0 55 155 86 86 0 0 1-55-155z" fill="#d7b77a" opacity=".48"/>
        <g fill="#d7b77a" opacity=".6">
          <circle cx="184" cy="176" r="2"/><circle cx="412" cy="153" r="2.8"/>
          <circle cx="448" cy="345" r="1.8"/><circle cx="153" cy="401" r="2.4"/>
          <circle cx="378" cy="451" r="2"/>
        </g>
  <text x="300" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="-.6" fill="#f8f3e8">O Céu e o Inferno</text>
  <line x1="238" y1="524" x2="362" y2="524" stroke="#d7b77a" stroke-opacity=".75"/>
  <text x="300" y="562" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.6" fill="#f8f3e8" fill-opacity=".84">ALLAN KARDEC</text>
  <text x="300" y="812" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#f8f3e8" fill-opacity=".68">A justiça divina segundo o Espiritismo</text>
  <text x="300" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="2" fill="#f8f3e8" fill-opacity=".46">AMOSTRA EDITORIAL · 1865</text>
  <rect width="600" height="900" filter="url(#grain)" opacity=".7"/>
</svg>